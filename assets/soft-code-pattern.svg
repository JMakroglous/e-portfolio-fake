<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Soft repeating code symbol background">
  <defs>
    <pattern id="marks" width="240" height="200" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <text x="20" y="105" fill="#64748b" fill-opacity="0.075" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="600" letter-spacing="-3">&lt;/&gt;</text>
      <text x="140" y="195" fill="#64748b" fill-opacity="0.045" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="600" letter-spacing="-2">&lt;/&gt;</text>
    </pattern>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#marks)"/>
</svg>
